services:
  httpd:
    image: busybox
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./mta-sts.txt:/www/.well-known/mta-sts.txt:ro
    command: ["httpd", "-f", "-p", "80", "-h", "/www"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          # httpd itself uses ~3.5 MB, but runc's init runs inside the same cgroup while the
          # container starts and needs ~7.5 MB on Docker 29: with 6M it was OOM-killed at start.
          memory: 32M
